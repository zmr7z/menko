<!DOCTYPE html>
<html lang="ja">
<head>

    .nav a { color:#fde68a; font-weight:700; text-decoration:none; min-height:2.5rem; display:inline-flex; align-items:center; }

    h1 { font-family:"Archivo Black",sans-serif; margin:0 0 .4rem; }
    .intro, time { color:var(--muted); }
    .ver { display:inline-block; background:#ffedd5; color:#9a3412; font-weight:900; border-radius:999px; padding:.15rem .55rem; font-size:.78rem; margin-right:.5rem; }

    <nav class="nav">

      <h2>公開</h2>
      <ul>
        <li>スマホは振る / PCはマウス振り回し</li>
