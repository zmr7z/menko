<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111827" />
  <meta property="og:title" content="めんこ・オブ・シェイク" />
  <meta property="og:description" content="振る／振り回してめんこをひっくり返せ。失敗でゲームオーバー。クリア後は岩チャレンジ。" />
  <title>めんこ・オブ・シェイク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">めんこ・オブ・シェイク</div>
      <div class="mode-tabs" role="tablist" aria-label="操作モード">
        <button type="button" class="tab" id="tab-phone" role="tab" aria-selected="false">振る</button>
        <button type="button" class="tab" id="tab-pc" role="tab" aria-selected="false">マウス</button>
      </div>
    </header>

    <div class="stage-bar">
      <span id="stage-label">STAGE 1 / 5</span>
      <strong id="foe-name">練習めんこ</strong>
      <span id="need-label"></span>
    </div>

    <main class="stage">
      <div class="arena" id="arena">
        <div class="card foe" id="card-foe">
          <div class="face front" id="foe-label">敵</div>
          <div class="face back">裏</div>
        </div>
        <div class="card you" id="card-you">
          <div class="face front">自</div>
          <div class="face back">裏</div>
        </div>
        <div class="rock hidden" id="rock" aria-hidden="true">岩</div>
      </div>
    </main>

    <div class="hud">
      <div class="meter" aria-hidden="true"><i id="meter-fill"></i></div>
      <p class="hint" id="hint">スタート後、振ってひっくり返せ</p>
      <p class="subhint" id="subhint">失敗1回でアウト</p>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="btn-start">はじめる</button>
      <button type="button" class="btn ghost" id="btn-perm" hidden>センサー許可</button>
    </div>
    <nav class="foot-links" aria-label="リンク">
      <a href="https://zmr7z.github.io/ludofolio/">ハブ</a>
      <a href="changelog.html">更新履歴</a>
    </nav>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <p class="eyebrow" id="result-eyebrow">結果</p>
        <h2 id="result-title">勝ち</h2>
        <p id="result-detail"></p>
        <p class="power-readout hidden" id="power-readout"></p>
        <div class="actions">
          <button type="button" class="btn primary" id="btn-next">つづける</button>
          <button type="button" class="btn ghost" id="btn-share">Xにポスト</button>
          <button type="button" class="btn ghost" id="btn-retry">はじめから</button>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
